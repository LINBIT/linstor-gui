name: Build and Package LINSTOR GUI

on:
  push:
    tags:
      - 'v*' # This will trigger the workflow for any tag starting with 'v'

permissions:
  contents: write

jobs:
  build-and-package:
    runs-on: ubuntu-latest

    env:
      TAG: ${{ github.ref_name }}
      GH_TOKEN: ${{ github.token }}

    steps:
      - uses: actions/checkout@v7

      - name: Use Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: VITE_VERSION="${TAG#v}" npm run build

      - name: Package
        run: |
          mv dist "linstor-gui-$TAG"
          tar -czf "linstor-gui-$TAG.tar.gz" "linstor-gui-$TAG"

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: linstor-gui-${{ github.ref_name }}.tar.gz
          path: linstor-gui-${{ github.ref_name }}.tar.gz

      # The release notes are this version's section of CHANGELOG.md.
      - name: Create GitHub release
        run: |
          awk -v v="${TAG#v}" '$1 == "#" && $2 == v { on = 1; next } on && /^# / { exit } on' CHANGELOG.md > notes.md
          if gh release view "$TAG" > /dev/null 2>&1; then
            gh release upload "$TAG" "linstor-gui-$TAG.tar.gz" --clobber
          else
            gh release create "$TAG" "linstor-gui-$TAG.tar.gz" --title "LINSTOR GUI $TAG" --notes-file notes.md --verify-tag
          fi
