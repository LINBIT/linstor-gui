variables:
# Same version linstor-server pins: the first Pulp-based build-helpers, with a
# published build-helpers docker image (carrying pulp-cli and lbbuildctl).
  BUILD_HELPERS_VERSION: bbebcdb3f5f69354111219750b347d30f81f41a9

image: node:22

stages:
  - test
  - e2e
  - build

# Rebuild the static OCF agent catalog from its three upstreams
# (resource-agents / drbd-utils / pacemaker) and publish it as an artifact.
# Nothing is executed: the agents' meta-data XML is parsed statically, so the
# runner needs only git + node — no resource-agents package, no cluster.
#
# Manual so a release can pick up new agents deliberately: download the artifact,
# commit it, and the change is reviewable in a normal MR. Running `npm run
# generate-agents` locally does the same thing.
generate-agents:
  stage: test
  rules:
    # Runs on every release tag as a check (the catalog tracks external
    # projects, so drift is expected and must not block the release);
    # on main it stays a button.
    - if: $CI_COMMIT_TAG
      allow_failure: true
    - if: $CI_COMMIT_BRANCH == "main"
      when: manual
      allow_failure: true
  before_script:
    - npm ci
  script:
    - npm run generate-agents
    - npm run type-check
    # Surface drift rather than failing the pipeline: the catalog tracks external
    # projects, so it going stale is expected and is a prompt to commit, not a break.
    - |
      if git diff --quiet -- src/app/components/OcfAgentEditor/all_agents.ts; then
        echo "OCF agent catalog is up to date."
      else
        echo "OCF agent catalog is OUT OF DATE — commit the artifact below."
        git --no-pager diff --stat -- src/app/components/OcfAgentEditor/all_agents.ts
      fi
  artifacts:
    paths:
      - 'src/app/components/OcfAgentEditor/all_agents.ts'
    expire_in: '30 days'

# The same thing for the Windows catalog, from ocf-resource-agents-rust. Its
# agents print their meta-data from a raw string literal, so this parses the
# source too — no Rust toolchain, no cargo build, git + node as above.
#
# That repo is on this GitLab, so it is cloned with CI_JOB_TOKEN rather than a
# deploy key. It has to allow this project in its CI_JOB_TOKEN allowlist
# (Settings > CI/CD > Job token permissions) or the clone gets a 404.
generate-agents-windows:
  stage: test
  rules:
    # Runs on every release tag as a check (the catalog tracks external
    # projects, so drift is expected and must not block the release);
    # on main it stays a button.
    - if: $CI_COMMIT_TAG
      allow_failure: true
    - if: $CI_COMMIT_BRANCH == "main"
      when: manual
      allow_failure: true
  before_script:
    - npm ci
  script:
    - |
      npm run generate-agents:windows -- \
        --repo "https://gitlab-ci-token:${CI_JOB_TOKEN}@${CI_SERVER_HOST}/drbd/ocf-resource-agents-rust.git"
    - npm run type-check
    # Drift is a prompt to commit, not a broken pipeline — same reasoning as above.
    - |
      if git diff --quiet -- src/app/components/OcfAgentEditor/windows_agents.ts; then
        echo "Windows agent catalog is up to date."
      else
        echo "Windows agent catalog is OUT OF DATE — commit the artifact below."
        git --no-pager diff --stat -- src/app/components/OcfAgentEditor/windows_agents.ts
      fi
  artifacts:
    paths:
      - 'src/app/components/OcfAgentEditor/windows_agents.ts'
    expire_in: '30 days'

# Gates the pipeline. It used to run plain `tsc --noEmit` against the solution
# tsconfig, which checks no files, so ~550 errors had accumulated unseen (#429);
# the job ran with allow_failure while that backlog was burned down. It is at
# zero now, so a new type error breaks the build.
type-check:
  stage: test
  rules:
    # Every MR, whatever it targets (an MR stacked on another one included).
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == "main"
    - if: $CI_COMMIT_TAG
  before_script:
    - npm ci
  script:
    - npm run type-check

test:
  stage: test
  rules:
    # Every MR, whatever it targets (an MR stacked on another one included).
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == "main"
    - if: $CI_COMMIT_TAG
  before_script:
    - npm ci
  script:
    - npm run lint
    - npm run format:check
    - npm run test:coverage
  coverage: '/All files.*?(\d+(?:\.\d+)?)\s*\|/'
  artifacts:
    reports:
      junit: junit.xml
      coverage_report:
        coverage_format: cobertura
        path: coverage/cobertura-coverage.xml
    expire_in: '30 days'

# End-to-end: the built GUI (vite preview) against the API mock in e2e/mock,
# driven by Playwright; see playwright.config.ts. The image carries the
# browsers and must match the @playwright/test version in package-lock.json.
e2e:
  # A stage of its own: in the test stage it ran next to the unit tests on the
  # same runner and both slowed down.
  stage: e2e
  image: mcr.microsoft.com/playwright:v1.63.0-noble
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == "main"
  before_script:
    - npm ci
  script:
    - npm run build
    - npm run e2e
  artifacts:
    when: always
    reports:
      junit: e2e-junit.xml
    paths:
      - playwright-report/
      - test-results/
    expire_in: '14 days'

# Build the release tarball with node, then hand it to the deploy job: the
# upload moved from the retired Nexus to Pulp, and the pulp CLI lives in the
# build-helpers image, not in node:22.
build:
  stage: build
  rules:
    # Every MR, whatever it targets (an MR stacked on another one included).
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == "main"
    - if: $CI_COMMIT_TAG
  interruptible: true
  before_script:
    - git init build-helpers -q -b unused
    - git -C build-helpers fetch -q --depth 1 $CI_SERVER_PROTOCOL://gitlab-ci-token:${CI_JOB_TOKEN}@$CI_SERVER_HOST:$CI_SERVER_PORT/linbit/build-helpers.git $BUILD_HELPERS_VERSION
    - git -C build-helpers checkout -q $BUILD_HELPERS_VERSION
  script:
    - echo "Node.js version:"
    - node -v
    - echo "npm version:"
    - npm -v
    - install /dev/null /usr/local/bin/lbvers.py # disable version checking
    # A release tag (vX.Y.Z) builds X.Y.Z: its commit carries the matching
    # debian/changelog and spec entries. Anything else is a 0.0.0.<sha>
    # snapshot with a generated changelog entry.
    - |
      if [ -n "$CI_COMMIT_TAG" ]; then
        VERSION="${CI_COMMIT_TAG#v}"
      else
        VERSION="0.0.0.$CI_COMMIT_SHORT_SHA"
        build-helpers/dummy-release.sh linstor-gui $VERSION 1 linstor-gui.spec
      fi
    - make VERSION="$VERSION" debrelease
  artifacts:
    paths:
      - 'linstor-gui-*.tar.gz'
    expire_in: '30 days'

# Upload the tarball to Pulp and trigger the package builds. Runs in the
# build-helpers image, which carries the pulp CLI and lbbuildctl
# (ci_prepare_tools links the Pulp config from $LINBIT_PULP_CONFIG_FILE).
deploy:
  stage: build
  rules:
    # Packages are built from main and from release tags only: an MR's build
    # job already proves the tarball builds, uploading it helps nobody.
    - if: $CI_COMMIT_BRANCH == "main"
    - if: $CI_COMMIT_TAG
  image: $LINBIT_DOCKER_REGISTRY/build-helpers:$BUILD_HELPERS_VERSION
  needs:
    - build
  script:
    - . gitlab-utils.sh
    - ci_prepare_tools
    # The image has pulp-cli but not lbbuildctl; fetch it from Pulp the same
    # way linstor-server does (the pinned ci_fetch_lbbuildctl still points at
    # the retired Nexus).
    - curl -sSfL https://pulp.at.linbit.com/pulp/content/file/lbbuild/lbbuildctl-latest -o /usr/local/bin/lbbuildctl
    - chmod +x /usr/local/bin/lbbuildctl
    - |
      if [ -n "$CI_COMMIT_TAG" ]; then VERSION="${CI_COMMIT_TAG#v}"; else VERSION="0.0.0.$CI_COMMIT_SHORT_SHA"; fi
    - pulp file content upload --repository lbbuild-upstream
      --file linstor-gui-$VERSION.tar.gz
      --relative-path linstor-gui-$VERSION.tar.gz
    - lbbuildctl build linstor-gui --ci -v "$VERSION"
      -e LINBIT_REGISTRY_USER=$LINBIT_REGISTRY_USER
      -e LINBIT_REGISTRY_PASSWORD=$LINBIT_REGISTRY_PASSWORD
      -e LINBIT_REGISTRY_URL=$LINBIT_REGISTRY_URL
      --arch amd64
      -d ubuntu-noble -d rhel9.0

sbom:
  rules:
    - if: $CI_COMMIT_TAG
  stage: build
  before_script:
    - git init build-helpers -q -b unused
    - git -C build-helpers fetch -q --depth 1 $CI_SERVER_PROTOCOL://gitlab-ci-token:${CI_JOB_TOKEN}@$CI_SERVER_HOST:$CI_SERVER_PORT/linbit/build-helpers.git $BUILD_HELPERS_VERSION
    - git -C build-helpers checkout -q $BUILD_HELPERS_VERSION
    - . build-helpers/gitlab-utils.sh
    - ci_prepare_tools
  script:
    - make deps sbom
    - ci_put_bom linstor-gui $CI_COMMIT_TAG sbom/linstor-gui.cdx.json
