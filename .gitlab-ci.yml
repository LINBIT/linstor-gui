variables:
  BUILD_HELPERS_VERSION: b67f7745a1485878063a43c3d5dc8b21eb15e966

image: node:20

stages:
  - test
  - build

# Rebuild the static OCF agent catalog from its three upstreams
# (resource-agents / drbd-utils / pacemaker) and publish it as an artifact.
# Nothing is executed: the agents' meta-data XML is parsed statically, so the
# runner needs only git + node — no resource-agents package, no cluster.
#
# Manual so a release can pick up new agents deliberately: download the artifact,
# commit it, and the change is reviewable in a normal MR. Running `npm run
# generate-agents` locally does the same thing.
generate-agents:
  stage: test
  rules:
    - if: $CI_COMMIT_TAG
      when: manual
      allow_failure: true
    - if: $CI_COMMIT_BRANCH == "main"
      when: manual
      allow_failure: true
  before_script:
    - npm ci
  script:
    - npm run generate-agents
    - npm run type-check
    # Surface drift rather than failing the pipeline: the catalog tracks external
    # projects, so it going stale is expected and is a prompt to commit, not a break.
    - |
      if git diff --quiet -- src/app/components/OcfAgentEditor/all_agents.ts; then
        echo "OCF agent catalog is up to date."
      else
        echo "OCF agent catalog is OUT OF DATE — commit the artifact below."
        git --no-pager diff --stat -- src/app/components/OcfAgentEditor/all_agents.ts
      fi
  artifacts:
    paths:
      - 'src/app/components/OcfAgentEditor/all_agents.ts'
    expire_in: '30 days'

# The same thing for the Windows catalog, from ocf-resource-agents-rust. Its
# agents print their meta-data from a raw string literal, so this parses the
# source too — no Rust toolchain, no cargo build, git + node as above.
#
# That repo is on this GitLab, so it is cloned with CI_JOB_TOKEN rather than a
# deploy key. It has to allow this project in its CI_JOB_TOKEN allowlist
# (Settings > CI/CD > Job token permissions) or the clone gets a 404.
generate-agents-windows:
  stage: test
  rules:
    - if: $CI_COMMIT_TAG
      when: manual
      allow_failure: true
    - if: $CI_COMMIT_BRANCH == "main"
      when: manual
      allow_failure: true
  before_script:
    - npm ci
  script:
    - |
      npm run generate-agents:windows -- \
        --repo "https://gitlab-ci-token:${CI_JOB_TOKEN}@${CI_SERVER_HOST}/drbd/ocf-resource-agents-rust.git"
    - npm run type-check
    # Drift is a prompt to commit, not a broken pipeline — same reasoning as above.
    - |
      if git diff --quiet -- src/app/components/OcfAgentEditor/windows_agents.ts; then
        echo "Windows agent catalog is up to date."
      else
        echo "Windows agent catalog is OUT OF DATE — commit the artifact below."
        git --no-pager diff --stat -- src/app/components/OcfAgentEditor/windows_agents.ts
      fi
  artifacts:
    paths:
      - 'src/app/components/OcfAgentEditor/windows_agents.ts'
    expire_in: '30 days'

test:
  stage: test
  rules:
    - if: $CI_MERGE_REQUEST_TARGET_BRANCH_NAME == "main"
    - if: $CI_COMMIT_BRANCH == "main"
  before_script:
    - npm ci
  script:
    - npm run lint
    - npm run type-check
    - npm run test:coverage
  coverage: '/All files.*?(\d+(?:\.\d+)?)\s*\|/'
  artifacts:
    reports:
      junit: junit.xml
      coverage_report:
        coverage_format: cobertura
        path: coverage/cobertura-coverage.xml
    expire_in: '30 days'

build:
  stage: build
  rules:
    - if: $CI_MERGE_REQUEST_TARGET_BRANCH_NAME == "main"
    - if: $CI_COMMIT_BRANCH == "main"
  interruptible: true
  before_script:
    - git init build-helpers -q -b unused
    - git -C build-helpers fetch -q --depth 1 $CI_SERVER_PROTOCOL://gitlab-ci-token:${CI_JOB_TOKEN}@$CI_SERVER_HOST:$CI_SERVER_PORT/linbit/build-helpers.git $BUILD_HELPERS_VERSION
    - git -C build-helpers checkout -q $BUILD_HELPERS_VERSION
    - . build-helpers/gitlab-utils.sh
    - ci_prepare_tools
    - ci_fetch_lbbuildctl
  script:
    - echo "Node.js version:"
    - node -v
    - echo "npm version:"
    - npm -v
    - VERSION="0.0.0.$CI_COMMIT_SHORT_SHA"
    - install /dev/null /usr/local/bin/lbvers.py # disable version checking
    - build-helpers/dummy-release.sh linstor-gui $VERSION 1 linstor-gui.spec
    - make VERSION="$VERSION" debrelease
    - curl -isSf -u $LINBIT_REGISTRY_USER:$LINBIT_REGISTRY_PASSWORD
      --upload-file linstor-gui-*.tar.gz
      $LINBIT_REGISTRY_URL/repository/lbbuild-upstream/
    - lbbuildctl build linstor-gui --ci -v "$VERSION"
      -e LINBIT_REGISTRY_USER=$LINBIT_REGISTRY_USER
      -e LINBIT_REGISTRY_PASSWORD=$LINBIT_REGISTRY_PASSWORD
      -e LINBIT_REGISTRY_URL=$LINBIT_REGISTRY_URL
      --arch amd64
      -d ubuntu-noble -d rhel9.0

  artifacts:
    paths:
      - 'linstor-gui-*.tar.gz'
    expire_in: '30 days'

sbom:
  rules:
    - if: $CI_COMMIT_TAG
  stage: build
  before_script:
    - git init build-helpers -q -b unused
    - git -C build-helpers fetch -q --depth 1 $CI_SERVER_PROTOCOL://gitlab-ci-token:${CI_JOB_TOKEN}@$CI_SERVER_HOST:$CI_SERVER_PORT/linbit/build-helpers.git $BUILD_HELPERS_VERSION
    - git -C build-helpers checkout -q $BUILD_HELPERS_VERSION
    - . build-helpers/gitlab-utils.sh
    - ci_prepare_tools
  script:
    - make deps sbom
    - ci_put_bom linstor-gui $CI_COMMIT_TAG sbom/linstor-gui.cdx.json
